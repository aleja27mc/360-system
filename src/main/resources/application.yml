server:
  port: 8080

spring:
  application:
    name: student-academic-service
  datasource:
    url: jdbc:h2:mem:academic-${random.uuid};MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:vista360-clave-demo-super-segura-cambiar-en-produccion-32b}
      issuer: vista360-demo-idp

academic:

  current-term: 2026-2

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [cid=%X{correlationId}] %logger{36} - %msg%n"
  level:
    com.universidad.vista360.academic: DEBUG
