<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx: 8; }
    .box-alt { fill: #eef3fb; stroke: #33538a; stroke-width: 2; rx: 8; }
    .box-data { fill: #f2f2f2; stroke: #555555; stroke-width: 1.5; rx: 6; }
    .box-event { fill: #fdf3e0; stroke: #a86b1a; stroke-width: 2; rx: 8; }
    .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .sub { font-size: 11.5px; fill: #333333; }
    .label { font-size: 11.5px; fill: #444444; }
    .section { font-size: 13px; font-weight: 700; fill: #666666; }
    line, path { stroke: #555555; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 5,4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>
  <text x="20" y="30" class="section">Vista 360, arquitectura general</text>

  <!-- Frontend -->
  <rect x="500" y="55" width="280" height="55" class="box-alt"/>
  <text x="640" y="78" text-anchor="middle" class="title">Frontend Vista 360</text>
  <text x="640" y="96" text-anchor="middle" class="sub">SPA, estudiante y acompañamiento</text>

  <line x1="640" y1="110" x2="640" y2="150"/>
  <text x="655" y="132" class="label">HTTPS + JWT</text>

  <!-- BFF -->
  <rect x="460" y="150" width="360" height="70" class="box-alt"/>
  <text x="640" y="174" text-anchor="middle" class="title">BFF / API Gateway (Spring Boot)</text>
  <text x="640" y="191" text-anchor="middle" class="sub">valida JWT, autoriza por rol, agrega la vista</text>
  <text x="640" y="207" text-anchor="middle" class="sub">propaga X-Correlation-Id</text>

  <!-- Adapters row -->
  <line x1="560" y1="220" x2="200" y2="270"/>
  <line x1="610" y1="220" x2="460" y2="270"/>
  <line x1="670" y1="220" x2="720" y2="270"/>
  <line x1="720" y1="220" x2="980" y2="270"/>
  <text x="330" y="248" class="label">REST síncrono, timeout corto</text>

  <rect x="90" y="270" width="220" height="55" class="box"/>
  <text x="200" y="292" text-anchor="middle" class="title" font-size="13">Adaptador Académico</text>
  <text x="200" y="308" text-anchor="middle" class="sub">este repo lo implementa (Parte 2)</text>

  <rect x="350" y="270" width="220" height="55" class="box"/>
  <text x="460" y="292" text-anchor="middle" class="title" font-size="13">Adaptador Financiero</text>
  <text x="460" y="308" text-anchor="middle" class="sub">consulta síncrona, sin cache</text>

  <rect x="610" y="270" width="220" height="55" class="box"/>
  <text x="720" y="292" text-anchor="middle" class="title" font-size="13">Adaptador LMS</text>
  <text x="720" y="308" text-anchor="middle" class="sub">actividad de campus virtual</text>

  <rect x="870" y="270" width="240" height="55" class="box"/>
  <text x="990" y="292" text-anchor="middle" class="title" font-size="13">Servicio de Acompañamiento</text>
  <text x="990" y="308" text-anchor="middle" class="sub">CRUD propio: reportes, alertas, solicitudes</text>

  <!-- Source systems -->
  <line x1="200" y1="325" x2="200" y2="370"/>
  <line x1="460" y1="325" x2="460" y2="370"/>
  <line x1="720" y1="325" x2="720" y2="370"/>
  <line x1="990" y1="325" x2="990" y2="370"/>

  <rect x="90" y="370" width="220" height="50" class="box-data"/>
  <text x="200" y="391" text-anchor="middle" class="sub" font-weight="600">Sistema Académico (ERP)</text>
  <text x="200" y="407" text-anchor="middle" class="sub">personal, matrícula, notas, condición</text>

  <rect x="350" y="370" width="220" height="50" class="box-data"/>
  <text x="460" y="391" text-anchor="middle" class="sub" font-weight="600">Sistema Financiero</text>
  <text x="460" y="407" text-anchor="middle" class="sub">saldos, becas, estado de cuenta</text>

  <rect x="610" y="370" width="220" height="50" class="box-data"/>
  <text x="720" y="391" text-anchor="middle" class="sub" font-weight="600">LMS</text>
  <text x="720" y="407" text-anchor="middle" class="sub">estilo Moodle o Canvas</text>

  <rect x="870" y="370" width="240" height="50" class="box-data"/>
  <text x="990" y="391" text-anchor="middle" class="sub" font-weight="600">Oracle propia (Vista 360)</text>
  <text x="990" y="407" text-anchor="middle" class="sub">dato nuevo, no existe en otro sistema</text>

  <!-- Event flow -->
  <line x1="200" y1="420" x2="200" y2="460" class="dashed"/>
  <line x1="200" y1="460" x2="200" y2="520" class="dashed"/>
  <text x="215" y="500" class="label">evento AcademicStatusChanged</text>

  <rect x="90" y="520" width="320" height="55" class="box-event"/>
  <text x="250" y="542" text-anchor="middle" class="title" font-size="13">Bus de eventos (Kafka)</text>
  <text x="250" y="559" text-anchor="middle" class="sub">eventId + timestamp, consumo idempotente</text>

  <line x1="180" y1="575" x2="180" y2="620"/>
  <line x1="320" y1="575" x2="320" y2="620"/>

  <rect x="60" y="620" width="240" height="55" class="box"/>
  <text x="180" y="642" text-anchor="middle" class="title" font-size="13">Motor de alertas</text>
  <text x="180" y="658" text-anchor="middle" class="sub">acompañamiento, intervención temprana</text>

  <rect x="320" y="620" width="240" height="55" class="box"/>
  <text x="440" y="642" text-anchor="middle" class="title" font-size="13">Pipeline ETL</text>
  <text x="440" y="658" text-anchor="middle" class="sub">más batch/CDC nocturno para históricos</text>

  <line x1="440" y1="675" x2="440" y2="700"/>
  <rect x="330" y="700" width="220" height="50" class="box-data"/>
  <text x="440" y="721" text-anchor="middle" class="sub" font-weight="600">Data Warehouse</text>
  <text x="440" y="737" text-anchor="middle" class="sub">consumidor, nunca fuente</text>
</svg>
