<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx: 8; }
    .box-alt { fill: #eef3fb; stroke: #33538a; stroke-width: 2; rx: 8; }
    .box-data { fill: #f2f2f2; stroke: #555555; stroke-width: 1.5; rx: 6; }
    .box-event { fill: #fdf3e0; stroke: #a86b1a; stroke-width: 2; rx: 8; }
    .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .sub { font-size: 11.5px; fill: #333333; }
    .label { font-size: 11.5px; fill: #444444; }
    .section { font-size: 13px; font-weight: 700; fill: #666666; }
    line, path { stroke: #555555; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 5,4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>
  <text x="20" y="30" class="section">Vista 360° del Estudiante — Arquitectura</text>

  <!-- Frontend -->
  <rect x="500" y="55" width="280" height="55" class="box-alt"/>
  <text x="640" y="78" text-anchor="middle" class="title">Frontend Vista 360°</text>
  <text x="640" y="96" text-anchor="middle" class="sub">SPA — estudiante / acompañamiento</text>

  <line x1="640" y1="110" x2="640" y2="150"/>
  <text x="655" y="132" class="label">HTTPS + JWT</text>

  <!-- BFF -->
  <rect x="460" y="150" width="360" height="70" class="box-alt"/>
  <text x="640" y="174" text-anchor="middle" class="title">BFF / API Gateway (Spring Boot)</text>
  <text x="640" y="191" text-anchor="middle" class="sub">AuthN/AuthZ · agrega vistas · circuit breaker</text>
  <text x="640" y="207" text-anchor="middle" class="sub">propaga X-Correlation-Id</text>

  <!-- Adapters row -->
  <line x1="560" y1="220" x2="200" y2="270"/>
  <line x1="610" y1="220" x2="460" y2="270"/>
  <line x1="670" y1="220" x2="720" y2="270"/>
  <line x1="720" y1="220" x2="980" y2="270"/>
  <text x="330" y="248" class="label">REST síncrono, timeout corto</text>

  <rect x="90" y="270" width="220" height="55" class="box"/>
  <text x="200" y="292" text-anchor="middle" class="title" font-size="13">Adaptador Académico</text>
  <text x="200" y="308" text-anchor="middle" class="sub">implementación de referencia = Parte 2</text>

  <rect x="350" y="270" width="220" height="55" class="box"/>
  <text x="460" y="292" text-anchor="middle" class="title" font-size="13">Adaptador Financiero</text>
  <text x="460" y="308" text-anchor="middle" class="sub">consulta síncrona, sin cache</text>

  <rect x="610" y="270" width="220" height="55" class="box"/>
  <text x="720" y="292" text-anchor="middle" class="title" font-size="13">Adaptador LMS</text>
  <text x="720" y="308" text-anchor="middle" class="sub">actividad de campus virtual</text>

  <rect x="870" y="270" width="240" height="55" class="box"/>
  <text x="990" y="292" text-anchor="middle" class="title" font-size="13">Servicio de Acompañamiento</text>
  <text x="990" y="308" text-anchor="middle" class="sub">CRUD propio (reportes/alertas/solicitudes)</text>

  <!-- Source systems -->
  <line x1="200" y1="325" x2="200" y2="370"/>
  <line x1="460" y1="325" x2="460" y2="370"/>
  <line x1="720" y1="325" x2="720" y2="370"/>
  <line x1="990" y1="325" x2="990" y2="370"/>

  <rect x="90" y="370" width="220" height="50" class="box-data"/>
  <text x="200" y="391" text-anchor="middle" class="sub" font-weight="600">Sistema Académico (ERP)</text>
  <text x="200" y="407" text-anchor="middle" class="sub">personal · matrícula · notas · condición</text>

  <rect x="350" y="370" width="220" height="50" class="box-data"/>
  <text x="460" y="391" text-anchor="middle" class="sub" font-weight="600">Sistema Financiero</text>
  <text x="460" y="407" text-anchor="middle" class="sub">saldos · becas · estado de cuenta</text>

  <rect x="610" y="370" width="220" height="50" class="box-data"/>
  <text x="720" y="391" text-anchor="middle" class="sub" font-weight="600">LMS</text>
  <text x="720" y="407" text-anchor="middle" class="sub">Moodle/Canvas-like</text>

  <rect x="870" y="370" width="240" height="50" class="box-data"/>
  <text x="990" y="391" text-anchor="middle" class="sub" font-weight="600">Oracle propia (Vista 360°)</text>
  <text x="990" y="407" text-anchor="middle" class="sub">datos nuevos, no existen en otro sistema</text>

  <!-- Legend: data origin -->
  <text x="90" y="450" class="section">De dónde sale cada dato</text>
  <text x="90" y="472" class="label">• Datos personales / matrícula / notas / condición académica → Sistema Académico (fuente única de verdad)</text>
  <text x="90" y="490" class="label">• Estado financiero / saldos → Sistema Financiero (fuente única de verdad, consulta síncrona sin cache)</text>
  <text x="90" y="508" class="label">• Actividad en campus virtual → LMS (único sistema que la registra)</text>
  <text x="90" y="526" class="label">• Reportes, alertas, solicitudes, asignación acompañante↔estudiante → BD propia Vista 360° (dato nuevo, no existe en otro sistema)</text>
  <text x="90" y="544" class="label">• Modelos analíticos → Data Warehouse (consumidor, nunca fuente)</text>

  <!-- Event flow -->
  <text x="90" y="590" class="section">Comunicación asíncrona (eventos de negocio)</text>

  <line x1="200" y1="420" x2="200" y2="450" class="dashed"/>
  <line x1="200" y1="450" x2="200" y2="630" class="dashed"/>
  <text x="215" y="620" class="label">evento AcademicStatusChanged</text>
  <text x="215" y="634" class="label">(eventId + timestamp, idempotente)</text>

  <rect x="90" y="640" width="320" height="55" class="box-event"/>
  <text x="250" y="662" text-anchor="middle" class="title" font-size="13">Bus de eventos (Kafka)</text>
  <text x="250" y="679" text-anchor="middle" class="sub">AcademicStatusChanged, NewAlert…</text>

  <line x1="180" y1="695" x2="180" y2="740"/>
  <line x1="320" y1="695" x2="320" y2="740"/>

  <rect x="60" y="740" width="240" height="55" class="box"/>
  <text x="180" y="762" text-anchor="middle" class="title" font-size="13">Motor de alertas tempranas</text>
  <text x="180" y="778" text-anchor="middle" class="sub">consumo idempotente por eventId</text>

  <rect x="320" y="740" width="240" height="55" class="box"/>
  <text x="440" y="762" text-anchor="middle" class="title" font-size="13">Pipeline ETL → Data Warehouse</text>
  <text x="440" y="778" text-anchor="middle" class="sub">+ batch/CDC nocturno para históricos</text>

  <line x1="440" y1="795" x2="440" y2="830"/>
  <rect x="330" y="830" width="220" height="50" class="box-data"/>
  <text x="440" y="851" text-anchor="middle" class="sub" font-weight="600">Data Warehouse</text>
  <text x="440" y="867" text-anchor="middle" class="sub">base de los modelos analíticos</text>

  <!-- Escalation A note -->
  <rect x="650" y="640" width="560" height="240" class="box" fill="#fafafa"/>
  <text x="670" y="665" class="title" font-size="13">Decisiones clave</text>
  <text x="670" y="688" class="label">• BFF único: centraliza AuthN/AuthZ y logging; cada sección de</text>
  <text x="682" y="704" class="label">  la vista degrada de forma independiente si un sistema falla.</text>
  <text x="670" y="724" class="label">• Adaptador por sistema fuente: aísla el ciclo de cambio de cada</text>
  <text x="682" y="740" class="label">  sistema legado (no es un integrador monolítico).</text>
  <text x="670" y="760" class="label">• Lectura síncrona para consulta: los sistemas fuente son la</text>
  <text x="682" y="776" class="label">  fuente de verdad, no se replican (evita inconsistencia).</text>
  <text x="670" y="796" class="label">• Bus de eventos solo para eventos de negocio reales, no para</text>
  <text x="682" y="812" class="label">  todo (evita over-engineering).</text>
  <text x="670" y="832" class="label">• Autorización revalidada en cada servicio backend, nunca solo</text>
  <text x="682" y="848" class="label">  en el gateway (defensa en profundidad).</text>
  <text x="670" y="868" class="label">• Auditoría de lecturas + correlation-id de punta a punta desde</text>
  <text x="682" y="884" class="label">  el diseño (soporta incidentes y reclamos de acceso, Parte 4).</text>
</svg>
